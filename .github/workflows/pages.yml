# Публикует игру на GitHub Pages при каждом пуше в main.
# Перед первым запуском: Settings → Pages → Source → GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check files
        run: python3 tools/check_site.py

      - name: Collect site files
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js *.png styles scripts _site/
          # Каждый деплой — новая версия кэша: браузер поставит её целиком, без смеси старых и новых файлов.
          sed -i "s/^const CACHE = '\([^']*\)';/const CACHE = '\1-${GITHUB_SHA::7}';/" _site/sw.js
          grep -q "${GITHUB_SHA::7}" _site/sw.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
